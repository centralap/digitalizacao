<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Digitalização Inteligente</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:
linear-gradient(135deg,#07152f,#0b1d46,#10285e);
min-height:100vh;
padding:20px;
color:white;
}

.container{
max-width:1700px;
margin:auto;
}

.topo{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
}

.logo-area h1{
font-size:30px;
font-weight:800;
}

.logo-area p{
color:#cbd5e1;
font-size:13px;
}

.status-rede{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.badge{
padding:10px 16px;
border-radius:999px;
font-size:12px;
font-weight:700;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.08);
}

.grid{
display:grid;
grid-template-columns:380px 1fr;
gap:20px;
}

.card{
background:rgba(7,18,40,0.88);
border-radius:24px;
padding:22px;
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
}

.card h2{
font-size:18px;
margin-bottom:18px;
color:#ffd978;
}

.input-group{
margin-bottom:16px;
}

.input-group label{
display:block;
font-size:12px;
margin-bottom:6px;
color:#cbd5e1;
}

.input-group input,
.input-group select{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.08);
background:#07152f;
color:white;
font-size:14px;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:14px;
font-weight:700;
cursor:pointer;
margin-top:10px;
font-size:14px;
transition:0.3s;
}

.btn-primary{
background:linear-gradient(135deg,#d7a53c,#ffd978);
color:#07152f;
}

.btn-primary:hover{
transform:translateY(-2px);
}

.btn-dark{
background:#07152f;
color:white;
border:1px solid rgba(255,255,255,0.08);
}

.preview{
height:80vh;
overflow:auto;
background:#07152f;
border-radius:18px;
padding:16px;
border:1px solid rgba(255,255,255,0.08);
}

.preview iframe{
width:100%;
height:100%;
border:none;
background:white;
border-radius:12px;
}

.info-box{
background:rgba(255,255,255,0.05);
padding:14px;
border-radius:14px;
margin-top:16px;
font-size:13px;
line-height:1.7;
}

.progress-area{
margin-top:18px;
}

.progress{
width:100%;
height:12px;
background:rgba(255,255,255,0.08);
border-radius:999px;
overflow:hidden;
}

.progress-bar{
width:0%;
height:100%;
background:linear-gradient(90deg,#d7a53c,#ffd978);
transition:0.3s;
}

.status{
margin-top:10px;
font-size:13px;
color:#dbe5f3;
}

.nome-final{
margin-top:12px;
padding:14px;
background:#07152f;
border-radius:12px;
font-weight:700;
word-break:break-word;
}

textarea{
width:100%;
min-height:150px;
background:#07152f;
color:white;
padding:12px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.08);
resize:vertical;
font-family:Inter;
}

</style>
</head>
<body>

<div class="container">

<div class="topo">

<div class="logo-area">
<h1>PAINEL DE DIGITALIZAÇÃO INTELIGENTE</h1>
<p>CENTRAL DE MONITORAMENTO ELETRÔNICO — CME</p>
</div>

<div class="status-rede">
<div class="badge">
<i class="fa-solid fa-print"></i>
 Brother MFC-L6912DW
</div>

<div class="badge">
<i class="fa-solid fa-wifi"></i>
 IP: 192.168.1.65
</div>

<div class="badge">
<i class="fa-solid fa-folder-open"></i>
 Pasta SCAN conectada
</div>
</div>

</div>

<div class="grid">

<div class="card">

<h2>
<i class="fa-solid fa-file-arrow-up"></i>
 Digitalização
</h2>

<div class="input-group">
<label>Selecionar Documento</label>
<input type="file" id="arquivo" accept=".pdf,image/*">
</div>

<div class="input-group">
<label>Categoria</label>
<select id="categoria">
<option value="ALVARA">ALVARÁ</option>
<option value="PROCESSO">PROCESSO</option>
<option value="MANDADO">MANDADO</option>
<option value="DECISAO">DECISÃO</option>
<option value="OCORRENCIA">OCORRÊNCIA</option>
<option value="OUTROS">OUTROS</option>
</select>
</div>

<div class="input-group">
<label>Nome do Arquivo</label>
<input type="text" id="nomeArquivo">
</div>

<button class="btn btn-primary" onclick="sugerirNome()">
<i class="fa-solid fa-wand-magic-sparkles"></i>
 Gerar Nome Automático
</button>

<button class="btn btn-primary" onclick="exportarDrive()">
<i class="fa-solid fa-cloud-arrow-up"></i>
 Exportar para Google Drive
</button>

<div class="progress-area">
<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="status" id="status">
Aguardando documento...
</div>
</div>

<div class="nome-final" id="nomeFinal">
Nenhum nome gerado.
</div>

</div>

<div class="card">

<h2>
<i class="fa-solid fa-file-pdf"></i>
 Visualização do Documento
</h2>

<div class="preview">
<iframe id="previewFrame"></iframe>
</div>

<div style="margin-top:20px;">

<h2>
<i class="fa-solid fa-file-lines"></i>
 Texto Extraído OCR
</h2>

<textarea id="textoOCR"></textarea>

</div>

</div>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

const arquivoInput = document.getElementById('arquivo');
const previewFrame = document.getElementById('previewFrame');
const progressBar = document.getElementById('progressBar');
const statusText = document.getElementById('status');

let textoExtraidoGlobal = '';

arquivoInput.addEventListener('change', async function(e){

const file = e.target.files[0];

if(!file) return;

const url = URL.createObjectURL(file);
previewFrame.src = url;

statusText.innerText = 'Processando documento...';

try{

let texto = '';

if(file.type === 'application/pdf'){
texto = await lerPDF(file);
}else{
texto = await lerImagem(file);
}

textoExtraidoGlobal = texto;

document.getElementById('textoOCR').value = texto;

statusText.innerText = 'Documento processado';

}catch(erro){

console.error(erro);

statusText.innerText = 'Erro ao processar documento';

}

});

async function lerImagem(file){

const resultado = await Tesseract.recognize(file,'por',{
logger:m=>{
if(m.progress){
progressBar.style.width =
Math.round(m.progress*100)+'%';
}
}
});

return resultado.data.text;

}

async function lerPDF(file){

const buffer = await file.arrayBuffer();

const pdf = await pdfjsLib.getDocument({
data:buffer
}).promise;

let textoFinal = '';

for(let i=1;i<=pdf.numPages;i++){

const page = await pdf.getPage(i);

const textContent = await page.getTextContent();

const textoNativo = textContent.items
.map(item=>item.str)
.join(' ');

textoFinal += '\n'+textoNativo;

}

return textoFinal;

}

function sugerirNome(){

const categoria =
document.getElementById('categoria').value;

const data = new Date();

const codigo =
String(data.getFullYear())+
String(data.getMonth()+1).padStart(2,'0')+
String(data.getDate()).padStart(2,'0')+
'_'+
String(data.getHours()).padStart(2,'0')+
String(data.getMinutes()).padStart(2,'0');

let nomeFinal =
`${categoria}_${codigo}.pdf`;

document.getElementById('nomeArquivo').value = nomeFinal;
document.getElementById('nomeFinal').innerText = nomeFinal;

}

async function exportarDrive(){

const arquivo =
document.getElementById('arquivo').files[0];

if(!arquivo){
alert('Selecione um arquivo.');
return;
}

const nomeArquivo =
document.getElementById('nomeArquivo').value;

if(!nomeArquivo){
alert('Gere um nome para o arquivo.');
return;
}

statusText.innerText =
'Enviando para Google Drive...';

progressBar.style.width = '20%';

const reader = new FileReader();

reader.onload = async function(){

try{

const base64 =
reader.result.split(',')[1];

const resposta = await fetch(
'https://script.google.com/macros/s/AKfycbxl07WB8rDuPAxWcuY2j4GIrfdQTG8rQ_CR-vRLuy-lrU1c7M6D8dS5HmQwBS4YOctG1Q/exec',
{
method:'POST',
body: JSON.stringify({
nomeArquivo:nomeArquivo,
mimeType:arquivo.type,
base64:base64
})
}
);

const texto = await resposta.text();

console.log(texto);

const resultado = JSON.parse(texto);

if(resultado.status === 'sucesso'){

progressBar.style.width = '100%';

statusText.innerText =
'Arquivo enviado com sucesso';

alert(
'Arquivo enviado com sucesso!\n\n'+
resultado.arquivo
);

}else{

alert(resultado.mensagem);

}

}catch(erro){

console.error(erro);

alert(
'Falha na integração com Google Drive.'
);

}

};

reader.readAsDataURL(arquivo);

}

</script>

</body>
</html>
